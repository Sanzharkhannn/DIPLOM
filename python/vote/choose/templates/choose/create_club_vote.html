{% extends "choose/index.html" %}

{% block title %}Создать голосование{% endblock %}

{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #1f1f1f, #3a3a3a);
        color: white;
    }
    .form-container {
        background: rgba(50, 50, 50, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
    }
    .form-control, .btn {
        transition: all 0.3s ease-in-out;
    }
    .form-control:focus {
        border-color: #ff9800;
        box-shadow: 0 0 10px rgba(255, 152, 0, 0.7);
    }
    .btn-primary {
        background: linear-gradient(45deg, #ff9800, #ff5722);
        border: none;
        padding: 15px 20px;
        font-size: 18px;
        width: 100%;
    }
    .btn-primary:hover {
        background: linear-gradient(45deg, #ff5722, #ff9800);
    }
    .btn-add {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(45deg, #4caf50, #388e3c);
        border: none;
        padding: 10px 18px;
        color: white;
        font-weight: bold;
        font-size: 16px;
        width: 100%;
        transition: transform 0.15s, box-shadow 0.3s;
    }
    .btn-add:hover {
        transform: scale(1.05);
        box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
    }
    .input-group {
        display: flex;
        align-items: center;
        position: relative;
    }
    .remove-option-btn {
        background: rgba(255, 0, 0, 0.2);
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        padding: 6px;
        border-radius: 50%;
        transition: background 0.3s, transform 0.2s;
        position: absolute;
        right: 5px;
        height: 30px;
        width: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(255, 0, 0, 0.3);
    }
    .remove-option-btn:hover {
        background: red;
        color: white;
        transform: scale(1.1);
        box-shadow: 0 3px 7px rgba(255, 0, 0, 0.5);
    }
</style>

<div class="container mt-5">
    <div class="form-container">
        <h2 class="text-center mb-4">Создать голосование</h2>
        <form action="{% url 'choose:create-poll' %}" method="post" class="row g-3">
            {% csrf_token %}
            
            <div class="col-12">
                <label for="voteTitle" class="form-label">Название голосования</label>
                <input type="text" class="form-control" id="voteTitle" name="vote_title" placeholder="Введите название" required>
            </div>

            <div class="col-12">
                <label for="voteDescription" class="form-label">Описание</label>
                <textarea class="form-control" id="voteDescription" name="vote_description" rows="3" placeholder="Опишите голосование" required></textarea>
            </div>

            <div class="col-12">
                <label class="form-label">Варианты ответа:</label>
                <div id="options-container">
                    <div class="input-group mb-2">
                        <input type="text" class="form-control" name="vote_options" placeholder="Вариант 1" required>
                        <button class="remove-option-btn" type="button">✖</button>
                    </div>
                </div>
                <button type="button" class="btn btn-add mt-2" id="add-option-btn">
                    ➕ Добавить вариант
                </button>
            </div>

            <div class="col-md-6">
                <label for="startDate" class="form-label">Дата начала</label>
                <input type="date" class="form-control" id="startDate" name="start_date" required>
            </div>

            <div class="col-md-6">
                <label for="endDate" class="form-label">Дата окончания</label>
                <input type="date" class="form-control" id="endDate" name="end_date" required>
            </div>

            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary">Создать голосование</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const addOptionBtn = document.getElementById('add-option-btn');
        const optionsContainer = document.getElementById('options-container');
        const maxOptions = 10;

        addOptionBtn.addEventListener('click', function () {
            if (optionsContainer.children.length >= maxOptions) {
                alert("Максимальное количество вариантов - " + maxOptions);
                return;
            }
            const optionCount = optionsContainer.children.length + 1;
            const optionField = document.createElement('div');
            optionField.classList.add('input-group', 'mb-2');
            optionField.innerHTML = `
                <input type="text" class="form-control" name="vote_options" placeholder="Вариант ${optionCount}" required>
                <button class="remove-option-btn" type="button">✖</button>
            `;
            optionsContainer.appendChild(optionField);
        });

        optionsContainer.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-option-btn')) {
                e.target.parentElement.remove();
            }
        });
    });
</script>

{% endblock %}
