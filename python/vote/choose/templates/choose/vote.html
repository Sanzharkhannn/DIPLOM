{% extends "choose/index.html" %}

{% block title %}Выборы для голосования{% endblock %}

{% block content %}

<section>
    <h2 class="text-center">Голосование</h2>
    <div class="container w-25">
        <!-- <div class="row "> -->
        <form action="{% url 'choose:create-content' %}" class="row align-items-center" method="post">
            {% csrf_token %}

            <label for="title">Content Title:</label>
            <input type="text" class="form-control" id="title" name="title" required>

            <label for="body">Content Description:</label>
            <input type="text" class="form-control" id="body" name="body" required>

            <div class="mb-3">
                <label for="exampleSelect" class="form-label">Выберите категорию</label>
                <select class="form-select" id="exampleSelect" name="category" required>
                    <option value="">Select</option>
                    <option value="soccer">Футбол (Soccer)</option>
                    <option value="movie">Кино (Movie)</option>
                    <option value="human">Люди (Human)</option>
                </select>
            </div>

            <div id="extra-buttons" class="mt-3"></div>

            <button type="submit" class="btn my-2 py-2 border btn-primary">Создать общий контент</button>
        </form>

        <script>
            document.getElementById('exampleSelect').addEventListener('change', function () {
                const value = this.value;
                const container = document.getElementById('extra-buttons');
                container.innerHTML = '';

                if (value === 'soccer') {
                    container.innerHTML = `
                        <h5>Создать голосование для:</h5>
                        <a href="{% url 'choose:create-club-vote' %}" class="btn btn-info my-1">Клубы</a>
                        <a href="{% url 'choose:create-player-vote' %}" class="btn btn-info my-1">Игроки</a>
                    `;
                } else if (value === 'movie') {
                    container.innerHTML = `
                        <h5>Создать голосование для:</h5>
                        <a href="{% url 'choose:create-movie-vote' %}" class="btn btn-info my-1">Фильмы</a>
                        <a href="{% url 'choose:create-actor-vote' %}" class="btn btn-info my-1">Актёры</a>
                    `;
                } else if (value === 'human') {
                    container.innerHTML = `
                        <h5>Создать голосование для:</h5>
                        <a href="{% url 'choose:create-profession-vote' %}" class="btn btn-info my-1">Профессии</a>
                        <a href="{% url 'choose:create-famous-vote' %}" class="btn btn-info my-1">Известные личности</a>
                    `;
                }
            });
        </script>

        <!-- </div> -->
    </div>
</section>

{% endblock %}
