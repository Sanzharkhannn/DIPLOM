{% extends "choose/index.html" %}

{% block title %}Выборы для голосования{% endblock %}

{% block content %}
<section class="d-flex justify-content-center align-items-center min-vh-100" style="background: linear-gradient(135deg, #1e1e2e, #282a36);">
    <div class="container p-5 rounded shadow-lg text-white" style="max-width: 500px; background: rgba(40, 42, 54, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);">
        <h2 class="text-center mb-4" style="color: #f8f9fa; font-weight: 700;">Голосование</h2>
        <form action="{% url 'choose:create-content' %}" method="post" class="needs-validation" novalidate>
            {% csrf_token %}

            <!-- <div class="mb-3">
                <label for="title" class="form-label">Название контента:</label>
                <input type="text" class="form-control custom-input" id="title" name="title" required>
                <div class="invalid-feedback">Пожалуйста, введите название.</div>
            </div>

            <div class="mb-3">
                <label for="body" class="form-label">Описание контента:</label>
                <input type="text" class="form-control custom-input" id="body" name="body" required>
                <div class="invalid-feedback">Пожалуйста, введите описание.</div>
            </div> -->

            <div class="mb-3">
                <label for="exampleSelect" class="form-label">Выберите категорию:</label>
                <select class="form-select custom-select" id="exampleSelect" name="category" required>
                    <option value="" selected disabled>Выберите категорию</option>
                    <option value="soccer">⚽ Футбол</option>
                    <option value="movie">🎬 Кино</option>
                    <option value="human">👤 Люди</option>
                </select>
                <div class="invalid-feedback">Пожалуйста, выберите категорию.</div>
            </div>

            <div id="extra-buttons" class="mt-3 text-center"></div>

            <!-- <button type="submit" class="btn custom-button w-100 py-2" id="submitButton" disabled>Создать общий контент</button> -->
        </form>
    </div>
</section>

<style>
    .custom-input {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 10px;
    }
    .custom-input:focus, .custom-select:focus {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .custom-select {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 10px;
    }
    .custom-select option {
        background: rgba(40, 42, 54, 0.9);
        color: #fff;
    }
    .custom-button {
        background: linear-gradient(135deg, #ff8c00, #ff4500);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s;
    }
    .custom-button:hover {
        background: linear-gradient(135deg, #ff4500, #ff8c00);
        transform: scale(1.05);
    }
    .custom-secondary-button {
        background: linear-gradient(135deg, #00b4db, #0083b0);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        color: #fff;
        transition: all 0.3s;
        display: block;
    }
    .custom-secondary-button:hover {
        background: linear-gradient(135deg, #0083b0, #00b4db);
        transform: scale(1.05);
    }
</style>

<script>
    document.getElementById('exampleSelect').addEventListener('change', function () {
        const value = this.value;
        const container = document.getElementById('extra-buttons');
        container.innerHTML = '';

        if (value === 'soccer') {
            container.innerHTML = `
                <h5 class="mt-3">Создать голосование для:</h5>
                <a href="{% url 'choose:create-club-vote' %}" class="btn custom-secondary-button my-1 w-100">🏆 Лучший клуб</a>
                <a href="{% url 'choose:create-player-vote' %}" class="btn custom-secondary-button my-1 w-100">⚽ Лучший игрок</a>
            `;
        } else if (value === 'movie') {
            container.innerHTML = `
                <h5 class="mt-3">Создать голосование для:</h5>
                <a href="{% url 'choose:create-movie-vote' %}" class="btn custom-secondary-button my-1 w-100">🎥 Лучший фильм</a>
                <a href="{% url 'choose:create-actor-vote' %}" class="btn custom-secondary-button my-1 w-100">🌟 Лучший актёр</a>
            `;
        } else if (value === 'human') {
            container.innerHTML = `
                <h5 class="mt-3">Создать голосование для:</h5>
                <a href="{% url 'choose:create-profession-vote' %}" class="btn custom-secondary-button my-1 w-100">💼 Лучшая профессия</a>
                <a href="{% url 'choose:create-famous-vote' %}" class="btn custom-secondary-button my-1 w-100">🌍 Известные личности</a>
            `;
        }
    });

    document.addEventListener('input', function () {
        const title = document.getElementById('title').value.trim();
        const body = document.getElementById('body').value.trim();
        const category = document.getElementById('exampleSelect').value;
        const submitButton = document.getElementById('submitButton');
        submitButton.disabled = !(title && body && category);
    });
</script>
{% endblock %}
